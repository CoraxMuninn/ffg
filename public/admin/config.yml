      - { label: "Description", name: "description", widget: "string" }
      - { label: "Icon", name: "icon", widget: "select", options: [package, shield-check, snowflake, ship, file-text, tag, search, handshake, factory, truck, thermometer, clipboard-check, globe, check-circle] }
      - { label: "Enabled", name: "enabled", widget: "boolean", default: true }
      - { label: "Order", name: "order", widget: "number", default: 1 }

