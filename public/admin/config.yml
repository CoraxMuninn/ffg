    folder: "content/en/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: slug
    summary: "{{title}}  —  {{date}}"
    sortable_fields: ["date", "order", "title"]
    view_filters:
      - label: "Published"
        field: enabled
        pattern: true
      - label: "Hidden"
        field: enabled
        pattern: false
    editor:
      preview: false
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        required: true
        hint: "Article headline. Rendered as the page H1."

      - label: "Slug"
        name: "slug"
        widget: "string"
        required: true
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Lowercase letters, numbers and hyphens only (e.g. sourcing-frozen-chicken-feet)."]
        hint: "URL segment: /en/blog/<slug>. Keep it stable — changing it changes the article URL."

      - label: "Language"
        name: "language"
        widget: "select"
        options:
          - { label: "English", value: "en" }
          - { label: "فارسی (Persian)", value: "fa" }
          - { label: "Русский (Russian)", value: "ru" }
          - { label: "Tiếng Việt (Vietnamese)", value: "vi" }
        default: "en"
        required: true
        hint: "Must stay 'en' for this collection — the folder determines the site language."

      - label: "Publication date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        required: true
        hint: "Shown on the article and used for ordering and structured data."

      - label: "Author"
        name: "author"
        widget: "string"
        required: false
        default: "Feiz Food Group Export Team"

      - label: "Excerpt / summary"
        name: "excerpt"
        widget: "text"
        required: true
        hint: "1–2 sentences. Used on the blog listing, and as the meta description when no SEO description is set."

      - label: "Featured image"
        name: "image"
        widget: "image"
        required: false
        media_folder: "/public/media/blog"
        public_folder: "/media/blog"
        choose_url: false
        hint: "Wide landscape image (≥1600px). Also used as the social share image."

      - label: "Image alt text"
        name: "imageAlt"
        widget: "string"
        required: false
        hint: "Describe what the image shows in the article language; do not repeat the article title unless it is an exact description."

      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        options:
          - "Sourcing"
          - "Quality Control"
          - "Cold Chain"
          - "Logistics"
          - "Markets"
          - "Documentation"

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        default: []
        field: { label: "Tag", name: "tag", widget: "string" }
        hint: "Optional keywords. Press Enter after each tag."

      - label: "SEO title"
        name: "seoTitle"
        widget: "string"
        required: false
        hint: "Overrides the browser/search title. Leave empty to use the article title."

      - label: "SEO description"
        name: "seoDescription"
        widget: "text"
        required: false
        hint: "Overrides the meta description (aim for ~155 characters). Leave empty to use the excerpt."

      - label: "Published"
        name: "enabled"
        widget: "boolean"
        default: true
        hint: "Off hides the article from the site without deleting it."

      - label: "Order"
        name: "order"
        widget: "number"
        default: 1
        value_type: "int"
        hint: "Lower numbers appear first in the listing."

      - label: "Body"
        name: "body"
        widget: "markdown"
        required: true
        hint: "Article content. Use ## for section headings — the H1 comes from the title."

