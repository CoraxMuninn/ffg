# ──────────────────────────────────────────────────────────────────────────
# Feiz Food Group — Nginx reverse proxy example (Roadmap Task 3.1)
# ──────────────────────────────────────────────────────────────────────────
# Single-instance VPS topology: Nginx terminates TLS and proxies to the
# `next start` process on 127.0.0.1:3000 (supervised by systemd).
#
# Install to /etc/nginx/sites-available/feiz-food and symlink into
# sites-enabled. Replace feizfood.com and the certificate paths. Run
# `nginx -t && systemctl reload nginx`.
#
# This config is the authoritative place where request-controlled headers are
# set/overwritten (audit SEC-M4 / SEC-L3): X-Real-IP and X-Forwarded-Proto are
# ALWAYS derived here, never trusted raw from the client, which is what makes
# TRUST_PROXY=true safe in the app.
# ──────────────────────────────────────────────────────────────────────────

# Rate / connection limits at the edge (defense in depth before the app's own
# limiter). Tune to taste.
limit_req_zone $binary_remote_addr zone=feiz_rfqs:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name feizfood.com www.feizfood.com;

    # ACME challenge passthrough, then permanent redirect to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name feizfood.com www.feizfood.com;

    # --- TLS ----------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/feizfood.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feizfood.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Sizes & timeouts (audit SEC-M5: bound request bodies here too) ----
    client_max_body_size 100k;
    client_body_timeout 30s;

    # --- TLS always (HSTS is also emitted by the app) ----------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # --- Health check (used by external monitors; not the app's own gate) --
    location = /api/health {
        limit_req zone=feiz_rfqs burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # --- App ----------------------------------------------------------------
    location / {
        limit_req zone=feiz_rfqs burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # trusted by the app
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;        # always https here
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static assets (Next serves these; let Nginx cache them at the edge).
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
